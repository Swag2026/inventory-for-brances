services:
  db:
    image: postgres:16-alpine
    container_name: swag-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: swag-inventory-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${DB_PASSWORD}@db:5432/inventory
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TOKEN_HOURS: ${TOKEN_HOURS:-12}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8120}:8000"

volumes:
  pgdata:
  uploads:
